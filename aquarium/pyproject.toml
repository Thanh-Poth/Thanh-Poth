[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-aquarium"
version = "0.1.0"
description = "Turn a GitHub profile into an animated ASCII aquarium SVG: one fish per repository."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thanh Son Potherat" }]
dependencies = []

[project.scripts]
ascii-aquarium = "ascii_aquarium.cli:main"

[tool.setuptools]
packages = ["ascii_aquarium"]
