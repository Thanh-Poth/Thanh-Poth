# ASCII ocean config: each repository becomes a sea animal seen from above.
user = "Thanh-Poth"

# Repos left out (the profile repo itself is always excluded).
exclude = []

include_forks = false
include_archived = true
max_fish = 18

width = 1000
height = 560

# Sprite length in characters, from the smallest to the largest repo (log scale).
font_size = 6           # px per character: smaller = finer drawings
min_cols = 22
max_cols = 58
frames = 12             # animation frames per swim cycle (cross-faded)
fish_color = "#cfdbe6"  # one colour for every animal
seed = "aquarium"       # change it to reshuffle lanes and directions

# Interactive page (GitHub Pages): the ocean is the background, this card sits on top.
page_title = "Thanh Son Potherat"
page_html = """
<h1>Thanh Son Potherat</h1>
<p>Engineering student specializing in <b>Data and Artificial Intelligence</b> at <b>ESILV</b> (Paris).
I turn raw data into robust pipelines and bridge the gap between local model development and production.</p>
<p><b>Looking for</b> a 6-month <b>Data Engineering / ML Engineering</b> internship from <b>April 2027</b>.</p>
<p>Hover an animal to see the project, click it to open the repository.</p>
<p><a href="https://github.com/Thanh-Poth">GitHub</a> · <a href="https://www.linkedin.com/in/thanh-son-potherat-b793b333a/">LinkedIn</a></p>
"""

# Bytes of a language count less for size (notebooks embed outputs and images).
[size_weights]
"Jupyter Notebook" = 0.25

# Override the main-language -> species table (ray, hammerhead, shark, turtle), e.g.
# [species]
# "Jupyter Notebook" = "ray"

# Combination rules, checked before the main language. Uncomment to replace the defaults:
# [[combos]]
# all = ["Python", "JavaScript|TypeScript"]   # full-stack -> hammerhead
# species = "hammerhead"
# min_share = 0.10
