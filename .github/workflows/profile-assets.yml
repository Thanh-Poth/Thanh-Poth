name: generate profile animations

on:
  # every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # manual run from the Actions tab
  workflow_dispatch:
  # on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: test the aquarium library
        working-directory: aquarium
        run: python -m unittest discover -s tests

      - name: generate aquarium.svg (one ASCII fish per repository)
        working-directory: aquarium
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m ascii_aquarium --config aquarium.toml --out ../dist/aquarium.svg

      # Both files go out in one push: this action replaces the whole output branch.
      - name: push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
