name: generate profile ocean

on:
  # every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # manual run from the Actions tab
  workflow_dispatch:
  # on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: test the aquarium library
        working-directory: aquarium
        run: python -m unittest discover -s tests

      - name: generate the README image and the interactive page
        working-directory: aquarium
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m ascii_aquarium --config aquarium.toml --out ../dist/aquarium.svg --html ../dist/index.html
          touch ../dist/.nojekyll

      # The output branch holds the SVG for the README and index.html for GitHub Pages.
      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
